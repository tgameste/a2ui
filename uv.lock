version = 1
revision = 3
requires-python = ">=3.14"
resolution-markers = [
    "python_full_version >= '3.15' and sys_platform == 'win32'",
    "python_full_version >= '3.15' and sys_platform == 'emscripten'",
    "python_full_version >= '3.15' and sys_platform != 'emscripten' and sys_platform != 'win32'",
    "python_full_version < '3.15' and sys_platform == 'win32'",
    "python_full_version < '3.15' and sys_platform == 'emscripten'",
    "python_full_version < '3.15' and sys_platform != 'emscripten' and sys_platform != 'win32'",
]

