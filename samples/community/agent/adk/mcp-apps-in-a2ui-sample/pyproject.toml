[project]
name = "a2ui-mcp-apps-in-a2ui-sample"
version = "0.1.0"
description = "Sample MCP App with 2-Way Communication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "google-genai>=1.27.0",
    "python-dotenv>=1.1.0",
    "fastapi>=0.123.10",
    "uvicorn~=0.34.0",
    "starlette>=0.50.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "aiohttp>=3.13.4",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
