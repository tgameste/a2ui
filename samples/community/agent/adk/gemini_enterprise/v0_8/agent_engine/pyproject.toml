[project]
name = "a2ui-contactcard-agentengine"
version = "0.1.0"
description = "Sample Google ADK-based Contact Lookup agent that uses a2ui extension and is hosted as an A2A agent on Agent Engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    "google-cloud-aiplatform[adk,agent-engines,evaluation]>=1.156.0",
    "a2ui-agent-sdk>=0.1.2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "protobuf>=6.31.1,<7.0.0",
]

[tool.uv.sources]
a2ui-agent-sdk = { workspace = true }
