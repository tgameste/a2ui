[project]
name = "rizzcharts"
version = "0.1.0"
description = "Sample Google ADK-based rizzcharts agent that uses a2ui extension with a custom catalog and is hosted as an A2A server agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    "click>=8.1.8",
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "google-genai>=1.27.0",
    "python-dotenv>=1.1.0",
    "litellm>=1.83.7",
    "jsonschema>=4.0.0",
    "a2ui-agent-sdk>=0.2.4",
    "uvicorn~=0.34.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "aiohttp>=3.13.4",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
a2ui-agent-sdk = { workspace = true }
