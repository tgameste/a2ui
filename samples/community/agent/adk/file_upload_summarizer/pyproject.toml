[project]
name = "file_upload_summarizer"
version = "0.1.0"
description = "A reference A2UI Agent demonstrating Host-Delegated IoC File Uploads and zero-context-bloat Pointer Resolution"
input-modes = ["text"]
output-modes = ["text"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    "click>=8.1.8",
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "google-genai>=1.27.0",
    "python-dotenv>=1.1.0",
    "litellm>=1.83.7",
    "jsonschema>=4.0.0",
    "a2ui-agent-sdk>=0.2.4",
    "uvicorn~=0.34.0",
    "starlette",
    "python-multipart>=0.0.20,<1.0.0",
    "httpx",
    "anyio",
    "aiohttp>=3.13.4",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.115.8,<1.0.0",
    "gcsfs>=2024.11.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "sqlalchemy>=2,<3",
]

[project.scripts]
file_upload_summarizer = "file_upload_summarizer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
a2ui-agent-sdk = { workspace = true }
